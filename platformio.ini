; ===================== PlatformIO Project Configuration =====================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --------------------- Libraries ---------------------
lib_deps = 
    chris--a/Keypad@^3.1.1
    bodmer/TFT_eSPI@^2.5.43
    adafruit/RTClib@^2.1.4

; --------------------- Build Flags -------------------
; Remove default C++ standard (usually C++11) and enforce C++17
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17           ; Enable C++17 / GNU extensions
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER

    ; TFT Pin definitions
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1

    ; SPI settings
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=200000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; Font options
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF

    ; Color / display settings
    -DILI9341_GREENTAB
    -DTFT_BGR
    -DILI9341_USE_LCD_CONTROLLER

    ; Additional features
    -DSPRITE_DMA
    -DSMOOTH_FONT

; --------------------- Optional ---------------------
; If you want to keep a unit testing environment
; [env:native]
; platform = native
; build_flags =
;     -DUNIT_TEST